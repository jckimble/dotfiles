[libinput]
enable_tap=true
accel-speed=0.5

[core]
idle-time=0

[shell]
panel-position=bottom
locking=false
animation=none
panel-size=24
icon-size=20

[keyboard]
keymap_layout=us

[launcher]
icon=/usr/share/icons/hicolor/48x48/apps/foot.png
path=/usr/bin/foot

[launcher]
icon=/usr/share/icons/hicolor/48x48/apps/google-chrome.png
path=/usr/bin/google-chrome --no-sandbox --ozone-platform=wayland --enable-features=WebUIDarkMode --force-dark-mode

[launcher]
icon=/usr/share/pixmaps/vscode.png
path=/usr/bin/code --no-sandbox --ozone-platform=wayland
